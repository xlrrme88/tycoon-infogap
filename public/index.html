<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>富人信息差 · TYCOON INFOGAP</title>
<style>
:root{
  --bg:#f5f0e1; --bg2:#e9dfc6;
  --paper:#ffffff; --paper2:#f6f0e0;
  --ink:#1a1a1a; --red:#b8322a; --reddeep:#8f241e;
  --onred:#fdf3e0; --title:#1a1a1a; --toptext:#3d3d3d;
  --muted:#9a8468; --keyword:#d6941e;
  --shadow:rgba(60,40,20,.14); --cardline:rgba(143,36,30,.25);
}
body.dark{
  --bg:#1a1a1e; --bg2:#232329;
  --paper:#26262c; --paper2:#30303a;
  --ink:#f0e8d6; --red:#c0392b; --reddeep:#a93226;
  --onred:#fdf3e0; --title:#f7ecd4; --toptext:#f7ecd4;
  --muted:#9a8a6e; --keyword:#e8b23a;
  --shadow:rgba(0,0,0,.55); --cardline:rgba(192,57,43,.35);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  background:linear-gradient(160deg,var(--bg),var(--bg2));
  min-height:100vh; padding:40px 20px 60px; transition:background .3s;
  color:var(--ink);
}
.deco{position:fixed;border-radius:50%;background:var(--red);pointer-events:none;z-index:0;}
.deco.d1{width:280px;height:280px;top:-90px;right:-90px;opacity:.08;}
.deco.d2{width:340px;height:340px;bottom:-120px;left:-120px;opacity:.05;}
.wrap{max-width:980px;margin:0 auto;position:relative;z-index:1;}
.toolbar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:10px;}
.date-wrap{display:flex;flex-direction:column;align-items:center;gap:3px;}
.date-tip{font-size:11px;color:var(--muted);letter-spacing:1px;opacity:.8;}
.chev{font-size:10px;opacity:.65;}
.btn{font-size:13px;font-weight:700;color:var(--reddeep);background:var(--paper);border:none;border-radius:999px;padding:8px 20px;cursor:pointer;box-shadow:3px 3px 0 var(--shadow);display:inline-flex;align-items:center;gap:6px;}
.btn svg{width:14px;height:14px;}
#calBackdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:55;}
.cal-panel{position:fixed;top:76px;left:50%;transform:translateX(-50%);width:min(600px,calc(100vw - 32px));max-height:calc(100vh - 110px);overflow:auto;z-index:60;background:var(--paper);border-radius:8px;box-shadow:6px 6px 0 var(--shadow);padding:18px;}
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
#calTitle{flex:1;text-align:center;font-size:15px;font-weight:800;color:var(--ink);letter-spacing:2px;}
.cal-head .btn{padding:6px 14px;font-size:12px;white-space:nowrap;}
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:6px;}
.cal-week span{text-align:center;font-size:12px;font-weight:700;color:var(--muted);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;}
.cal-day{border:1px solid transparent;border-radius:8px;color:var(--muted);font-size:13px;min-height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:default;}
.cal-day .dot{width:6px;height:6px;border-radius:50%;background:var(--red);margin-top:4px;}
.cal-day.avail{cursor:pointer;color:var(--ink);font-weight:700;}
.cal-day.avail:hover{border-color:var(--red);}
.cal-day.today{border-color:var(--red);}
.cal-day.sel{background:var(--red);border-color:var(--red);color:var(--onred);}
.cal-day.sel .dot{background:var(--onred);}
.cal-note{font-size:11px;color:var(--muted);margin-top:10px;}
header{text-align:center;padding:16px 0 6px;}
.seal{display:inline-block;background:var(--red);color:var(--onred);font-size:13px;font-weight:800;border-radius:4px;padding:5px 12px;letter-spacing:4px;margin-bottom:16px;box-shadow:3px 3px 0 var(--shadow);}
h1{font-size:56px;font-weight:900;color:var(--title);letter-spacing:14px;text-shadow:2px 2px 0 rgba(184,50,42,.20);margin-left:14px;}
body.dark h1{text-shadow:3px 3px 0 var(--reddeep),6px 6px 0 var(--shadow);}
.en-sub{margin-top:10px;font-size:12px;letter-spacing:5px;color:var(--toptext);opacity:.85;font-weight:700;}
.date{margin-top:12px;font-size:16px;color:var(--toptext);letter-spacing:6px;font-weight:700;opacity:.95;}
.cutline{border-top:2px dashed var(--cardline);opacity:.6;margin:28px 12px;position:relative;}
.cutline span{position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--red);border-radius:4px;padding:2px 16px;font-size:13px;color:var(--onred);letter-spacing:6px;font-weight:700;white-space:nowrap;}
.colhead{display:grid;grid-template-columns:70px 1fr 150px;gap:16px;padding:0 22px;margin-bottom:10px;font-size:13px;font-weight:800;color:var(--toptext);opacity:.9;letter-spacing:3px;}
.item{background:var(--paper);border-radius:8px;padding:20px 22px;display:grid;grid-template-columns:70px 1fr 150px;gap:16px;align-items:center;margin:0 6px 16px;box-shadow:6px 6px 0 var(--shadow);transition:background .3s, transform .15s;}
.item:hover{transform:translate(-2px,-2px);}
.num{width:40px;height:40px;border-radius:50%;background:var(--red);color:var(--onred);font-size:17px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:2px 2px 0 var(--shadow);}
.fact{font-size:15px;line-height:1.8;color:var(--ink);}
.fact b{color:var(--keyword);}
.src{font-size:12px;color:var(--muted);margin-top:8px;}
.src a{color:var(--muted);}
.signal{text-align:center;font-size:14px;font-weight:900;color:var(--ink);border-left:2px solid var(--cardline);padding-left:16px;line-height:1.7;}
.deep{background:var(--paper);border-radius:8px;margin:6px 6px 16px;padding:32px 36px;box-shadow:6px 6px 0 var(--shadow);border-top:8px solid var(--red);transition:background .3s;}
.deep-tag{display:inline-block;background:var(--red);color:var(--onred);font-size:14px;font-weight:900;border-radius:999px;padding:6px 20px;letter-spacing:3px;box-shadow:2px 2px 0 var(--shadow);}
.deep h2{font-size:23px;color:var(--ink);line-height:1.6;margin:18px 0 6px;}
.deep .summary{font-size:14px;line-height:1.9;color:var(--ink);background:var(--paper2);border-radius:8px;padding:14px 16px;margin:14px 0;}
.deep .summary b{color:var(--red);}
.flow{display:flex;align-items:stretch;margin:20px 0 8px;flex-wrap:wrap;}
.step{flex:1;min-width:130px;border:2px solid var(--red);border-radius:8px;padding:14px 10px;text-align:center;font-size:14px;font-weight:800;color:var(--ink);background:var(--paper2);}
.step small{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:6px;}
.arrow{display:flex;align-items:center;justify-content:center;padding:0 10px;font-size:22px;color:var(--red);font-weight:900;}
.point{border-left:5px solid var(--red);padding:4px 0 4px 16px;margin:22px 0;}
.point h3{font-size:15px;color:var(--red);margin-bottom:8px;}
.point p{font-size:14px;line-height:1.85;color:var(--ink);}
.point p b{color:var(--keyword);}
.vs{display:grid;grid-template-columns:1fr 1fr;margin:24px 0 6px;border:2px solid var(--cardline);border-radius:8px;overflow:hidden;}
.vs div{padding:20px 12px;text-align:center;font-size:14px;line-height:2;color:var(--ink);}
.vs div:first-child{border-right:2px solid var(--cardline);}
.vs b{display:block;font-size:16px;color:var(--red);margin-bottom:4px;}
.takeaway{margin:6px;background:var(--reddeep);color:var(--onred);border-radius:8px;padding:22px 28px;font-size:15px;line-height:1.9;box-shadow:6px 6px 0 var(--shadow);}
.takeaway b{letter-spacing:3px;font-size:16px;}
.state-card{background:var(--paper);border-radius:8px;margin:0 6px 16px;padding:40px 24px;text-align:center;box-shadow:6px 6px 0 var(--shadow);font-size:15px;color:var(--ink);line-height:2;}
.state-card .btn{margin-top:12px;}
footer{text-align:center;font-size:12px;color:var(--toptext);opacity:.7;margin-top:28px;letter-spacing:3px;line-height:2;}
.to-top{position:absolute;right:-58px;transform:translateY(-50%);z-index:50;width:46px;height:46px;border-radius:12px;background:var(--reddeep);color:var(--onred);border:none;font-size:20px;font-weight:900;cursor:pointer;box-shadow:3px 3px 0 var(--shadow);}
.to-top:hover{transform:translateY(-50%) scale(1.08);}
@media(max-width:1120px){.to-top{right:10px;}}@media(max-width:640px){.to-top{right:8px;width:42px;height:42px;}}
@media(max-width:640px){
  h1{font-size:34px;letter-spacing:8px;}
  .colhead{display:none;}
  .item{grid-template-columns:1fr;}
  .signal{border-left:none;border-top:2px solid var(--cardline);padding:10px 0 0;text-align:left;}
  .deep{padding:22px 18px;}
  .cal-grid{grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-day{font-size:11px;padding:8px 2px;}
}
</style>
</head>
<body class="dark">
<div class="deco d1"></div><div class="deco d2"></div>
<div class="wrap">
  <div class="toolbar">
    <div class="date-wrap">
    <button class="btn" id="dateBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span id="dateBtnLabel">选择日期</span><span class="chev">▾</span>
    </button>
    <div class="date-tip">回看点击日历</div>
    </div>
    <button class="btn" id="themeToggle">切换浅色模式</button>
  </div>
  <div id="calBackdrop" hidden></div>
  <div id="calPanel" class="cal-panel" hidden>
    <div class="cal-head">
      <button class="btn" id="prevMonth">‹ 上月</button>
      <span id="calTitle">--</span>
      <button class="btn" id="nextMonth">下月 ›</button>
      <button class="btn" id="todayBtn">回到今天</button>
    </div>
    <div class="cal-week"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
    <div id="calGrid" class="cal-grid"></div>
    <div class="cal-note">红点日期有内容可看 · 可回看最近 30 天</div>
  </div>
  <header>
    <div class="seal">每 日 情 报</div>
    <h1>富人信息差</h1>
    <div class="en-sub">TYCOON INFOGAP · DAILY BRIEF</div>
    <p class="date" id="dateLine">--</p>
  </header>

  <div class="cutline"><span id="newsLabel">今日七条</span></div>
  <div class="colhead"><span>序号</span><span>新闻事实</span><span style="text-align:center;">信号解读</span></div>
  <main id="news"></main>

  <div class="cutline"><span>本期干货</span></div>
  <section id="deep"></section>
  <div id="takeawayWrap"></div>
  <button id="toTop" class="to-top" hidden aria-label="回到顶部">↑</button>
  <footer>富人信息差 · TYCOON INFOGAP<br>每天早上自动更新 · 可回看最近 30 天</footer>
</div>
<script>
(function(){
  var newsEl = document.getElementById('news');
  var deepEl = document.getElementById('deep');
  var takeawayWrap = document.getElementById('takeawayWrap');
  var dateLine = document.getElementById('dateLine');
  var dateBtnLabel = document.getElementById('dateBtnLabel');
  var newsLabel = document.getElementById('newsLabel');
  var calPanel = document.getElementById('calPanel');
  var calGrid = document.getElementById('calGrid');

  // ---- theme ----
  var root = document.body, toggle = document.getElementById('themeToggle');
  function applyTheme(dark){
    root.classList.toggle('dark', dark);
    toggle.textContent = dark ? '切换浅色模式' : '切换深色模式';
    try{ localStorage.setItem('tig-theme', dark ? 'dark' : 'light'); }catch(e){}
  }
  var saved = null;
  try{ saved = localStorage.getItem('tig-theme'); }catch(e){}
  applyTheme(saved ? saved === 'dark' : true);
  toggle.addEventListener('click', function(){ applyTheme(!root.classList.contains('dark')); });

  // ---- dates ----
  function shanghaiToday(){
    return new Date(Date.now() + 8*3600*1000).toISOString().slice(0,10);
  }
  function fmtCN(ds){
    var p = ds.split('-');
    return p[0] + '年' + (+p[1]) + '月' + (+p[2]) + '日';
  }
  function shortMD(ds){
    var p = ds.split('-');
    return (+p[1]) + '/' + (+p[2]);
  }
  var today = shanghaiToday();
  var available = [];
  var current = null;

  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

  // 富文本：把 AI 输出的 **加粗** 统一转为 <b>，只允许 b 标签，其余一律转义
  function rich(s){
    s = String(s==null?'':s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
    var opens = (s.match(/<b>/g) || []).length, closes = (s.match(/<\/b>/g) || []).length;
    for (var i = 0; i < opens - closes; i++) s += '</b>'; // 配平未闭合标签，防止后面整段变黄
    return s.split(/(<\/?b>)/g).map(function(part, i){ return i % 2 === 1 ? part : esc(part); }).join('');
  }

  function showLoading(){
    newsEl.innerHTML = '<div class="state-card">正在加载信息差…</div>';
    deepEl.innerHTML = ''; takeawayWrap.innerHTML = '';
  }
  function showError(msg, date){
    newsEl.innerHTML = '<div class="state-card">' + esc(msg) + '<br><button class="btn" onclick="location.reload()">重试</button></div>';
    deepEl.innerHTML = ''; takeawayWrap.innerHTML = '';
  }

  function render(d){
    current = d.date;
    dateLine.textContent = fmtCN(d.date);
    dateBtnLabel.textContent = fmtCN(d.date);
    newsLabel.textContent = (d.date === today ? '今日' : fmtCN(d.date)) + (d.items || []).length + '条';
    var items = d.items || [];
    newsEl.innerHTML = items.map(function(it, i){
      return '<article class="item"><div class="num">' + (i+1) + '</div>' +
        '<div><p class="fact">' + rich(it.fact) + '</p>' +
        '<p class="src">来源：' + esc(it.source || '') + (it.link ? ' · <a href="' + esc(it.link) + '" target="_blank" rel="noopener">原文</a>' : '') + '</p></div>' +
        '<div class="signal">' + rich(it.signal).replace(/，/g, '<br>') + '</div></article>';
    }).join('');
    var dd = d.deepdive;
    if (!dd) {
      deepEl.innerHTML = '<div class="deep"><div class="deep-tag">本期干货</div>' +
        '<p style="font-size:14px;line-height:2;color:var(--ink);margin-top:14px;">本期干货正在生成中，稍后再来看看 → ' +
        '<a href="javascript:location.reload()" style="color:var(--red);font-weight:700;">刷新</a></p></div>';
      takeawayWrap.innerHTML = '';
      buildCalendar();
      placeToTop();
      return;
    }
    var flow = (dd.flow && dd.flow.length) ? '<div class="flow">' + dd.flow.map(function(s, i){
      return (i>0 ? '<div class="arrow">→</div>' : '') +
        '<div class="step">' + rich(s.label) + (s.sub ? '<small>' + rich(s.sub) + '</small>' : '') + '</div>';
    }).join('') + '</div>' : '';
    var points = (dd.points || []).map(function(p){
      return '<div class="point"><h3>' + rich(p.heading) + '</h3><p>' + rich(p.body) + '</p></div>';
    }).join('');
    var cmp = dd.compare ? '<div class="vs"><div><b>' + rich(dd.compare.a.title) + '</b>' +
      dd.compare.a.lines.map(rich).join('<br>') + '</div><div><b>' + rich(dd.compare.b.title) + '</b>' +
      dd.compare.b.lines.map(rich).join('<br>') + '</div></div>' : '';
    deepEl.innerHTML = '<div class="deep"><div class="deep-tag">本期干货</div><h2>' + rich(dd.title) + '</h2>' +
      (dd.summary ? '<div class="summary"><b>一句话理解</b> · ' + rich(dd.summary) + '</div>' : '') +
      flow + points + cmp + '</div>';
    takeawayWrap.innerHTML = dd.takeaway ?
      '<div class="takeaway"><b>收藏要点</b><br>' + rich(dd.takeaway) + '</div>' : '';
    buildCalendar();
    placeToTop();
  }

  function load(date){
    showLoading();
    fetch('/data/' + encodeURIComponent(date) + '.json').then(function(r){
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).catch(function(){
      return fetch('/api/digest?date=' + encodeURIComponent(date)).then(function(r){
        if(!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      });
    }).then(function(d){
      if(d.error) throw new Error(d.error);
      render(d);
    }).catch(function(){
      var isToday = date === today;
      showError(isToday ? '今日信息差正在生成中，请稍后再来看看' : '该日期暂无内容');
    });
  }

  var calCursor = null;
  function monthStart(d){ return new Date(d.getFullYear(), d.getMonth(), 1); }
  function buildCalendar(){
    var nowS = new Date(Date.now() + 8*3600*1000);
    if(!calCursor) calCursor = monthStart(nowS);
    var y = calCursor.getFullYear(), m = calCursor.getMonth();
    document.getElementById('calTitle').textContent = y + '年' + (m + 1) + '月';
    var firstDow = new Date(y, m, 1).getDay();
    var daysInMonth = new Date(y, m + 1, 0).getDate();
    function p2(n){ return (n < 10 ? '0' : '') + n; }
    var html = '';
    for(var i = 0; i < firstDow; i++) html += '<div></div>';
    for(var d = 1; d <= daysInMonth; d++){
      var ds = y + '-' + p2(m + 1) + '-' + p2(d);
      var has = available.indexOf(ds) >= 0;
      html += '<div class="cal-day' + (has ? ' avail' : '') + (ds === current ? ' sel' : '') + (ds === today ? ' today' : '') +
        '" data-d="' + ds + '">' + d + (has ? '<span class="dot"></span>' : '') + '</div>';
    }
    calGrid.innerHTML = html;
    var cells = calGrid.querySelectorAll('.cal-day.avail');
    for(var j = 0; j < cells.length; j++){
      (function(c){
        c.addEventListener('click', function(){
          load(c.getAttribute('data-d'));
          closeCal();
          window.scrollTo({top:0, behavior:'smooth'});
        });
      })(cells[j]);
    }
  }
  document.getElementById('prevMonth').addEventListener('click', function(){
    var nowS = new Date(Date.now() + 8*3600*1000);
    var minM = monthStart(new Date(nowS.getTime() - 29*86400000));
    if(calCursor > minM){
      calCursor = new Date(calCursor.getFullYear(), calCursor.getMonth() - 1, 1);
      buildCalendar();
    }
  });
  document.getElementById('nextMonth').addEventListener('click', function(){
    var nowS = new Date(Date.now() + 8*3600*1000);
    if(calCursor < monthStart(nowS)){
      calCursor = new Date(calCursor.getFullYear(), calCursor.getMonth() + 1, 1);
      buildCalendar();
    }
  });

  var calBackdrop = document.getElementById('calBackdrop');
  function closeCal(){ calPanel.hidden = true; calBackdrop.hidden = true; }
  document.getElementById('dateBtn').addEventListener('click', function(){
    var opening = calPanel.hidden;
    calPanel.hidden = !opening;
    calBackdrop.hidden = !opening;
  });
  calBackdrop.addEventListener('click', closeCal);
  var toTop = document.getElementById('toTop');
  function toggleToTop(){ toTop.hidden = window.scrollY < 300; }
  window.addEventListener('scroll', toggleToTop, {passive:true});
  toggleToTop();
  toTop.addEventListener('click', function(){ window.scrollTo({top:0, behavior:'smooth'}); });
  function placeToTop(){
    var wrap = document.querySelector('.wrap');
    var vsEl = document.querySelector('#deep .vs');
    if(!toTop || !wrap || !vsEl) return;
    var y = vsEl.getBoundingClientRect().top - wrap.getBoundingClientRect().top + vsEl.offsetHeight/2;
    toTop.style.top = y + 'px';
  }
  var rszT;
  window.addEventListener('resize', function(){ clearTimeout(rszT); rszT = setTimeout(placeToTop, 150); });
  window.addEventListener('load', placeToTop);

  document.getElementById('todayBtn').addEventListener('click', function(){
    closeCal();
    calCursor = null;
    load(today);
    window.scrollTo({top:0, behavior:'smooth'});
  });

  // ---- init ----
  showLoading();
  fetch('/data/index.json').then(function(r){ return r.ok ? r.json() : []; }).catch(function(){ return []; }).then(function(staticDates){
    return fetch('/api/dates').then(function(r){ return r.json(); }).then(function(d){ return d.dates || []; }).catch(function(){ return []; }).then(function(kvDates){
      var seen = {}, merged = [];
      staticDates.concat(kvDates).forEach(function(x){ if(x && !seen[x]){ seen[x] = 1; merged.push(x); } });
      return merged.sort();
    });
  }).then(function(dates){
    available = dates;
    var first = available.length ? available[available.length - 1] : today;
    load(first);
  }).catch(function(){ load(today); });
})();
</script>
</body>
</html>
