name: Daily Infogap Digest

on:
  schedule:
    # 每天 22:00 UTC = 北京时间次日 06:00
    - cron: '0 22 * * *'
  workflow_dispatch: # 手动触发

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 生成今日信息差
        run: python scripts/generate.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: 提交数据
        run: |
          git config user.name "infogap-bot"
          git config user.email "infogap-bot@localhost"
          git add public/data/
          git diff --staged --quiet || (git commit -m "daily digest $(date -u +%F)" && git push)
